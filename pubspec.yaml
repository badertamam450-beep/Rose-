name: dental_app
description: "My Rose Dental - Dr. Malek Dental App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Cloud
  firebase_core: ^3.6.0
  firebase_storage: ^12.3.4
  cloud_firestore: ^5.4.4

  # Google AI Studio (Gemini)
  google_generative_ai: ^0.4.6

  # Media & PDF Viewers
  video_player: ^2.9.2
  chewie: ^1.8.5
  flutter_pdfview: ^1.3.2

  # File Management & Downloading
  dio: ^5.7.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # UI Extensions
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  firebase_core: ^3.6.0
  firebase_storage: ^12.3.4
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
