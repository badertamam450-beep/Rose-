name: Final DR MALEK Dental APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Dart state update syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("setState(()=>{news=n;loadingNews=false;});", "setState((){news=n;loadingNews=false;});")
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet || git commit -m "fix: correct Dart state update syntax"
          git push

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define="GEMINI_API_KEY=$GEMINI_KEY"

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload real APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-malek-alromimah-dental-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
