name: Build Dental App APK (Android 15)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode google-services.json
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
            echo "✅ google-services.json generated successfully."
          else
            echo "⚠️ Warning: GOOGLE_SERVICES_JSON_BASE64 is empty."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=$GEMINI_KEY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dental-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
