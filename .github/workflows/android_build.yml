name: Production Build - My Rose Dental APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Production Android 15 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Google Services Config (Firebase)
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Decode Keystore Signing (if provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          MROSE_APP_ORGANIZATION_YEMEN_ID: ${{ secrets.MROSE_APP_ORGANIZATION_YEMEN_ID }}
          PROJECT_NUMBER: ${{ secrets.PROJECT_NUMBER }}
          TOKEN_ROSE: ${{ secrets.TOKEN_ROSE }}
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=DATABASE_ID="$DATABASE_ID" \
            --dart-define=MROSE_APP_ORGANIZATION_YEMEN_ID="$MROSE_APP_ORGANIZATION_YEMEN_ID" \
            --dart-define=PROJECT_NUMBER="$PROJECT_NUMBER" \
            --dart-define=TOKEN_ROSE="$TOKEN_ROSE"

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dental-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload Production APK Mirror Name
        uses: actions/upload-artifact@v4
        with:
          name: My-Rose-Dental-v1.0-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
